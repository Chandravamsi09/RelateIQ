apiVersion: apps/v1
kind: Deployment
metadata:
  name: relateiq-backend-deployment
  namespace: relateiq-prod
  labels:
    app.kubernetes.io/name: relateiq-backend
    app.kubernetes.io/part-of: relateiq-crm
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 5
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: relateiq-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relateiq-backend
    spec:
      containers:
      - name: api-server
        image: relateiq/backend:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: relateiq-config
        - secretRef:
            name: relateiq-secrets
        resources:
          limits:
            cpu: "2000m"
            memory: "2048Mi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
